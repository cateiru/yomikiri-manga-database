# otelcol-mackerel（MDOT Collector）のログ収集パイプライン定義。
# 本番は mackerel/otelcol-mackerel イメージ（compose.prod.yaml の otelcol-mackerel サービス）に
# /home/nonroot/config.yaml として bind mount して使う。
#
# MACKEREL_APIKEY 等の秘匿情報はここには書かない
# （compose.prod.yaml の otelcol-mackerel サービスの environment 側で管理する）。
#
# バッチは ofelia (job-local) の run-batch.sh から起動されるため systemd unit として
# 動かない。journald にはログが乗らないため、run-batch.sh が標準出力・標準エラーを
# リダイレクトしている /var/log/yomikiri/batch.log を filelog receiver で直接読む。
# 対象ファイルを1本に限定することで、旧 journald 設定の units フィルタと同等の
# 「コスト事故防止（無料枠 月1GB の超過防止）」を確定的に維持する。
#
# file_storage extension（読み取りカーソルの永続化）は使わない。mackerel/otelcol-mackerel
# ディストリビューションにこのコンポーネントが含まれておらず
# （実際に起動して "unknown type: file_storage" エラーで確認済み。upstream の
# manifest.yaml にも extensions セクションが無い）、代わりに storage 未指定のまま動かす。
# 影響は Collector 再起動中に出力されたログが再起動後に再読込されない
# （`start_at: end` のため）ことのみで、致命的ではないため許容する。

receivers:
  filelog:
    include:
      - /var/log/yomikiri/batch.log
    start_at: end # 導入時点までの過去ログを一括取り込みしない

processors:
  # Mackerel はログを service.name（+ service.namespace）リソース属性で識別するため、
  # filelog レシーバーが自動設定しない service.name をここで明示的に付与する。
  # 未設定のままだと Mackerel 側の「サービス名」表示が unknown_service になる。
  resource:
    attributes:
      - key: service.name
        value: "yomikiri-batch"
        action: upsert
  # filelog レシーバーの body は apps/batch/src/logger.ts が出力する JSON 行の文字列
  # そのもの（journald の MESSAGE ラップが無いため、旧設定にあった
  # body["MESSAGE"] 展開ステップは不要）。ParseJSON して level/message 等を取り出し、
  # level を severity_text / severity_number にも反映させる（未設定だと Mackerel 側の
  # ログレベル表示が UNSPECIFIED のままになる）。apps/batch/src/logger.ts が出力する
  # レベルは info/warn/error の3種類のみ。
  transform:
    error_mode: ignore # JSON以外の行が来てもパイプラインを止めない
    log_statements:
      - context: log
        statements:
          - 'merge_maps(attributes, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\{")'
          - 'set(severity_text, attributes["level"]) where attributes["level"] != nil'
          - 'set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "info"'
          - 'set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "warn"'
          - 'set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "error"'
  batch: {}

exporters:
  mackerel_otlp: {}
  # APIキーは compose.prod.yaml の otelcol-mackerel サービスの environment
  # （リポジトリ直下の .env から MACKEREL_APIKEY だけを ${VAR} 展開で渡す）で
  # 設定する MACKEREL_APIKEY 環境変数から exporter が読む。

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource, transform, batch]
      exporters: [mackerel_otlp]
