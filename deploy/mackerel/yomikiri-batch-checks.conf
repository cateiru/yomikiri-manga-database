# 本番は compose.prod.yaml の mackerel-agent サービスが、このファイルを
# /etc/mackerel-agent/conf.d/ 配下に bind mount し、include 環境変数
# （= mackerel-agent.conf 内の include 設定）経由で読み込む。
# [plugin.checks.*] が conf.d 経由（include）では読み込まれないという記述が
# 過去のここのコメントにあったが、mackerelio/mackerel-agent の config.go
# （includeConfigFile が include 先ファイルにも setEachPlugins() を呼び直す実装）と
# 実機検証（Docker イメージ上で configtest 成功、include 行の反映を確認）の
# 両方で誤りだったことを確認済み。conf.d への配置のみで動作する。
# check-file-age は mackerel-check-plugins に含まれるプラグインで、
# deploy/mackerel-agent/Dockerfile のベースイメージ（mackerel/mackerel-agent）に
# 標準で同梱されている（別途インストール不要）。
#
# 各 command はすべて $PWD を参照するため文字列形式（shell 経由。mackerel-agent の
# Command.Run() は文字列形式のみ内部で `sh -c` にラップし、配列形式は exec.Command を
# 直接呼ぶためシェル変数展開されない）で書く。$PWD は compose.prod.yaml の
# mackerel-agent サービスが environment: PWD: ${PWD} で明示的に設定しており、
# checks プラグインのサブプロセスにも継承される（cmdutil.RunCommandArgsContext の
# `cmd.Env = append(os.Environ(), opt.Env...)` で確認済み）。これによりクローン先の
# パスに関わらず動作する。

# last-success（run-batch.sh 成功時に touch されるファイル）の鮮度を監視する。
# 実行は毎日 00:05・12:05・18:05（JST）で、最大間隔は 12 時間（18:05→翌 00:05）。
# 13 時間（46800 秒）で警告、16 時間（57600 秒）でクリティカルとし、
# 「実行漏れ・ハング」を検知する。
[plugin.checks.yomikiri-batch-freshness]
command = "check-file-age -f \"$PWD/data/lib/yomikiri/last-success\" -w 46800 -c 57600"
notification_interval = 60

# systemctl is-failed の代替。last-failure が last-success より新しければ
# 直近の実行が失敗している（run-batch.sh が else 節で touch する）。
# 注意: この仕組みは run-batch.sh が失敗を検知して else 節に到達した場合のみ機能する。
# ofelia コンテナ自体が kill された、Docker ソケットに到達できない等でスクリプトが
# 異常終了した場合はどちらのマーカーも更新されず、下の yomikiri-ofelia-service
# チェックか yomikiri-batch-freshness の 13 時間鮮度アラームでのみ検知される
# （旧 systemctl is-failed が持っていた「任意の非ゼロ終了を即時検知」との完全な等価ではない）。
[plugin.checks.yomikiri-batch-last-failure]
command = "[ -e \"$PWD/data/lib/yomikiri/last-failure\" ] && { [ ! -e \"$PWD/data/lib/yomikiri/last-success\" ] || [ \"$PWD/data/lib/yomikiri/last-failure\" -nt \"$PWD/data/lib/yomikiri/last-success\" ]; } && exit 2 || exit 0"
notification_interval = 60

# ofelia コンテナ自体の死活監視（上記の残るギャップの一部をカバーする）。
[plugin.checks.yomikiri-ofelia-service]
command = "docker compose -p app -f \"$PWD/compose.prod.yaml\" ps ofelia --status running --quiet | grep -q . && exit 0 || exit 2"
notification_interval = 60
