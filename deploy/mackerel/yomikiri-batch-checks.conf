# mackerel-agent は conf.d/*.conf から [plugin.checks.*] を読み込まないため、
# このファイルの内容は /etc/mackerel-agent/mackerel-agent.conf の末尾に
# 直接追記して使う（conf.d への配置では動作しない）。
# check-file-age は mackerel-check-plugins に含まれるプラグイン。別途インストールし、
# 実際のインストール先に応じて command のパスを調整すること。

# last-success（run-batch.sh 成功時に touch されるファイル）の鮮度を監視する。
# 実行は毎日 00:05・12:05・18:05（JST）で、最大間隔は 12 時間（18:05→翌 00:05）。
# 13 時間（46800 秒）で警告、16 時間（57600 秒）でクリティカルとし、
# 「実行漏れ・ハング」を検知する。
[plugin.checks.yomikiri-batch-freshness]
command = ["check-file-age", "-f", "/var/lib/yomikiri/last-success", "-w", "46800", "-c", "57600"]
notification_interval = 60

# systemctl is-failed の代替。last-failure が last-success より新しければ
# 直近の実行が失敗している（run-batch.sh が else 節で touch する）。
# 注意: この仕組みは run-batch.sh が失敗を検知して else 節に到達した場合のみ機能する。
# ofelia コンテナ自体が kill された、Docker ソケットに到達できない等でスクリプトが
# 異常終了した場合はどちらのマーカーも更新されず、下の yomikiri-ofelia-service
# チェックか yomikiri-batch-freshness の 13 時間鮮度アラームでのみ検知される
# （旧 systemctl is-failed が持っていた「任意の非ゼロ終了を即時検知」との完全な等価ではない）。
[plugin.checks.yomikiri-batch-last-failure]
command = ["/bin/sh", "-c", "[ -e /var/lib/yomikiri/last-failure ] && { [ ! -e /var/lib/yomikiri/last-success ] || [ /var/lib/yomikiri/last-failure -nt /var/lib/yomikiri/last-success ]; } && exit 2 || exit 0"]
notification_interval = 60

# ofelia コンテナ自体の死活監視（上記の残るギャップの一部をカバーする）。
[plugin.checks.yomikiri-ofelia-service]
command = ["/bin/sh", "-c", "docker compose -p app -f /opt/yomikiri/app/compose.prod.yaml ps ofelia --status running --quiet | grep -q . && exit 0 || exit 2"]
notification_interval = 60
